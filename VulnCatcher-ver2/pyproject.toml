[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunset-two"
version = "1.0.0"
description = "VulnCatcher：zip LLM 自主发现 + AWVS URL 动态候选，两条可选管线，POC 与报告为终点"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "For authorized security testing only" }

[project.scripts]
sunset = "sunset.cli:main"

[tool.setuptools]
packages = ["sunset", "sunset.agents", "sunset.rules", "sunset.security"]
